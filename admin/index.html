<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | V.R. Bisutería</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#faf8f5;color:#4a4238;font-family:Montserrat;padding:2rem}main{max-width:900px;margin:auto}h1{font:700 2.5rem 'Cormorant Garamond';color:#6b4b24}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}.card{background:white;border:1px solid #e7d7bd;border-radius:16px;padding:1.5rem}.num{font-size:2rem;color:#a66b18}button{padding:12px 18px;background:#a66b18;color:white;border:0;border-radius:30px;cursor:pointer}p{line-height:1.6}</style></head><body><main><a href="/">← Volver a la tienda</a><h1>Administración V.R. Bisutería</h1><p>Acceso restringido a la cuenta administradora autorizada en Supabase.</p><button id="login">Iniciar sesión</button> <button id="refresh">Actualizar estadísticas</button><p id="status">Conecta Supabase para habilitar el panel.</p><div class="grid"><div class="card">Visitas totales<div class="num" id="visits">—</div></div><div class="card">Sesiones únicas<div class="num" id="sessions">—</div></div><div class="card">Registros voluntarios<div class="num" id="registrations">—</div></div><div class="card">Encuestas<div class="num" id="surveys">—</div></div></div></main><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const c=window.VR_CONFIG||{};const sb=c.supabaseUrl&&!c.supabaseUrl.includes('TU_')?supabase.createClient(c.supabaseUrl,c.supabaseAnonKey):null;const status=document.getElementById('status');document.getElementById('login').onclick=async()=>{if(!sb){status.textContent='Falta configurar Supabase.';return;}const email=prompt('Correo administrador');const password=prompt('Contraseña');if(!email||!password)return;const {error}=await sb.auth.signInWithPassword({email,password});status.textContent=error?'No se pudo iniciar sesión.':'Sesión iniciada.';};document.getElementById('refresh').onclick=async()=>{if(!sb){status.textContent='Falta configurar Supabase.';return;}const {data:{session}}=await sb.auth.getSession();if(!session){status.textContent='Inicia sesión primero.';return;}const r=await fetch('/.netlify/functions/admin-stats',{headers:{Authorization:'Bearer '+session.access_token}});const d=await r.json();if(!r.ok){status.textContent=d.error||'Error';return;}visits.textContent=d.total_visits;sessions.textContent=d.unique_sessions;registrations.textContent=d.registrations;surveys.textContent=d.surveys;status.textContent='Estadísticas actualizadas.';};</script></body></html>
